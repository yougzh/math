# Item：10 以内加法（sd_add_10）
#
# 这批是"已经会、但还没完全自动化"的基础题，主要供 Planner 的热身段与前置复习使用。
#
# difficulty 与 generators.sd_add_10_difficulty 同一条规则：和 ≤ 5 为 1、6~8 为 2、
# 9~10 为 3。难度只由**和的大小**决定，同一道题不允许出现两个难度档 ——
# 否则同一道 4+5 会因为来自哪个文件而被判成不同的难度。

items:
  - code: s10_3_4
    competency: sd_add_10
    pattern: direct_compute
    difficulty: 2
    scaffold_level: direct
    interaction_type: number_pad
    estimated_seconds: 6
    problem: {a: 3, b: 4, prompt: "3 + 4 = ?"}
    answer: 7
    steps: ["从 3 往后数 4 个"]
    hint_chain: ["从 3 开始，往后数 4 个"]
    error_rules:
      - {code: counting_dependency, match: {answer_off_by: 1}}

