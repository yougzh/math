# Item：凑十（make_ten）
#
# 同一个数学事实（8+5）在三个脚手架级别上各有一道题：
#   blocks    → 用十格框把 8 补满到 10，看得见"拆"
#   decompose → 拖拽把 5 拆成 2 和 3，半抽象
#   direct    → 直接算，抽象
# 这就是「具体 → 半抽象 → 抽象」的脚手架递退，具体选哪一级由 Planner 依据熟练度决定。

items:
  # ── blocks：十格框补满 ────────────────────────────────
  - code: mt_blk_8_5
    competency: make_ten
    pattern: decompose
    difficulty: 1
    scaffold_level: blocks
    interaction_type: blocks
    estimated_seconds: 20
    problem: {a: 8, b: 5, target: 10, prompt: "摆出 8 个，再摆出 5 个。把十格框补满，一共是多少个？"}
    answer: 13
    steps: ["8 补满到 10 需要 2", "5 拆成 2 和 3", "10 加上剩下的 3"]
    hint_chain:
      - "8 再添几个就满十格框了？"
      - "从 5 个里面拿几个过去补满？"
      - "补满以后，外面还剩几个？"
    error_rules:
      - {code: counting_dependency, match: {answer_off_by: 1}}
      - {code: make_ten_not_used, match: {answer_in: [11, 12, 14, 15]}}

