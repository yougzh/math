# 数字车站 · 第 7 站：装满一节
#
# 目标能力：sd_add_20（20 以内加法）
# 故事只回答"为什么做"：今天只有一节车厢，先上来的、后上来的，一共多少人。
# beat 的 code 只写局部名，loader 会自动拼成 "{story_code}__{local}"。

