beats:
  - code: b1
    type: narration
    character: 售票员小鹿
    text: 这一节车厢刚刚坐满，看起来挤挤的，也很热闹。
  - code: b2
    type: challenge
    text: 到了下一站，有几位乘客下车了。车上原来坐满了人，现在还剩多少位？
  - code: b3
    type: narration
    character: 小熊站长
    text: 小熊站长扶着乘客下车，还帮一位老奶奶把小包递到手上。
  - code: b4
    type: challenge
    text: 行李架上的行李被拎走了一些。架子上还剩着多少件行李？
  - code: b5
    type: narration
    character: 行李员阿吉
    text: 阿吉顺手把空座位拍了拍，让座位看起来整整齐齐。
  - code: b6
    type: challenge
    text: 票箱里的票也用掉了一些。数一数，票箱里还剩多少张票？
  - code: b7
    type: reward
    character: 小猫滴滴
    text: 空出来的座位一个挨一个晒着太阳。火车轻轻晃了晃，又出发了。

