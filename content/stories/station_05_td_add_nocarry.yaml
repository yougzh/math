  code: station_05_td_add_nocarry
  title: 数字车站 · 第 5 站：两节车厢
  universe: number_station
  summary: 今天挂了两节车厢，乘客和行李分头坐好、放好，再合起来数一数。
  order_index: 5
  duration_min: 6
  target_competencies: [td_add_nocarry]

beats:
  - code: b1
    type: narration
    character: 售票员小鹿
    text: 今天的火车挂了两节车厢，一节在前面，一节在后面，座位都擦得亮亮的。
  - code: b2
    type: challenge
    text: 前面一节坐着一些乘客，后面一节也坐着一些。两节车厢合起来，一共坐了多少位？
  - code: b3
    type: narration
    character: 小熊站长
    text: 小熊站长吹响哨子，火车“当当”地进站，窗户里亮着一排小灯。
  - code: b4
    type: challenge
    text: 先上车的乘客坐在前一节，后来的坐在后一节。今天一共来了多少位乘客？
  - code: b5
    type: narration
    character: 行李员阿吉
    text: 行李员阿吉把行李也码好了，大箱子一堆，小箱子一堆。
  - code: b6
    type: challenge
    text: 大箱子和小箱子合在一起，阿吉今天一共搬了多少件行李？
  - code: b7
    type: reward
    character: 小熊站长
    text: 两节车厢都坐好了，行李也放好了。小熊站长吹哨子：“出发！”

