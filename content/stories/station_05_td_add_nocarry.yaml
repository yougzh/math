# 数字车站 · 第 5 站：两节车厢
#
# 目标能力：td_add_nocarry（两位数加法，不进位）
# 故事只回答"为什么做"：前面一节加后面一节，合起来看一共多少。
# beat 的 code 只写局部名，loader 会自动拼成 "{story_code}__{local}"。

