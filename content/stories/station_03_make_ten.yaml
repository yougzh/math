  code: station_03_make_ten
  title: 数字车站 · 第 3 站：凑十特快
  universe: number_station
  summary: 装橘子的忙早晨：把小筐补满、把两筐合起来，看还剩几个、一共几个。
  order_index: 3
  duration_min: 6
  target_competencies: [make_ten]

beats:
  - code: b1
    type: narration
    character: 行李员阿吉
    text: 今天要送一批橘子。行李员阿吉推着小车，筐子里的橘子滚来滚去。
  - code: b2
    type: challenge
    text: 阿吉想把橘子装进大筐，可是筐子还差一点点。再放进几个，筐子就装满了呢？
  - code: b3
    type: narration
    character: 小猫滴滴
    text: 滴滴追着滚出来的橘子跑，尾巴扫得橘子咕噜噜转。阿吉笑着喊它回来。
  - code: b4
    type: challenge
    text: 筐里的橘子要倒在一起了。先数一数筐里的，再数一数外面的，一共有多少个？
  - code: b5
    type: narration
    character: 小熊站长
    text: 火车“当当”地进站。小熊站长帮阿吉把筐子一件一件搬上车。
  - code: b6
    type: challenge
    text: 最后一筐也要装车了。装完这一筐，车上总共有多少个橘子？
  - code: b7
    type: reward
    character: 行李员阿吉
    text: 橘子整整齐齐地码在车厢里，一个都没掉。阿吉擦擦汗，笑得很开心。

