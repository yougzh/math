# 数字车站 · 第 6 站：下车的人
#
# 目标能力：td_sub_nocarry（两位数减法，不退位）
# 故事只回答"为什么做"：到站有人下车、行李被搬走，剩下的要数清楚。
# beat 的 code 只写局部名，loader 会自动拼成 "{story_code}__{local}"。

